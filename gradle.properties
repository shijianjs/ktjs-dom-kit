kotlin.js.yarn=false

# Browser test suites and the Kotlin daemon can exhaust the default heap on CI runners.
kotlin.daemon.jvmargs=-Xmx3g

# Artifact and plugin versions are not kept here: `gradle/libs.versions.toml` is the single list,
# read through the generated `libs` accessor. This file only holds Gradle/Kotlin user settings.
#
# That includes the ktjs-docusaurus triple (plugin, wrapper klib, kit): they are three independent
# versions of one project, one per module there. A `-SNAPSHOT` one resolves from `mavenLocal`: a
# working tree of ktjs-docusaurus publishes it with `./gradlew publishToMavenLocal` (root build for
# the klibs) and the same task inside `ktjs-docusaurus-gradle-plugin/` (for the plugin).
