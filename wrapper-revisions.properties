# Per-module wrapper revisions. The published version of an npm-backed module is
# {upstream npm version}-kt.{its revision}. Bump only the modules whose wrapper code or published
# metadata changed; unchanged modules keep their already-published version, so a release does not
# create unnecessary artifacts or waste file/size quota on them.
#
# Release Count is per Central deployment, not per module: one Gradle invocation passes every
# pending module to the plugin, whose shared build service bundles them into a single deployment.
# Batching, not dropping modules, is what keeps the monthly count low.
#
# The counter is per module: never reset it to 1, even after an upstream version bump.
#
# There is no entry for ktjs-dom-kit: it wraps no npm package and carries a hand-written semantic
# version in its own build script (see `semanticModules` in build.gradle.kts). Libraries added later
# that do wrap an npm package start here at 1.
